version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10

  # The base images box rootfs images are built FROM, pinned by digest in
  # images/*/Dockerfile. A bump is a change to that image's directory, so
  # merging it rebuilds and republishes the image (build-fc-images.yml).
  - package-ecosystem: "docker"
    directories:
      - "/images/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
