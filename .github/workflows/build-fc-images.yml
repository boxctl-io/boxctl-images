name: build-fc-images

# Bakes and publishes boxctl-vms's own Firecracker rootfs images to
# Cloudflare R2 whenever one of them changes -- no more hand-running
# scripts/images/bake-*.sh over SSH on aimax for a routine rebuild.
#
# runs-on: onctl-2 (this repo's own onctl-runners pool, already used by
# build-image.yml) rather than a new dedicated self-hosted runner like
# onctl-runners' own build-fc-runner-image.yml uses. Verified live before
# writing this: debootstrap + loop-mount + chroot all work fine inside an
# onctl-2 job (it's a real VM with root + loop devices, confirmed via a
# throwaway `onctl create -p fc` + `mkfs.ext4`/`mount -o loop` round-trip)
# -- no KVM needed for baking. What onctl-2 can NOT do is a real
# boot-smoke-test: `/dev/kvm` doesn't exist inside it (confirmed the same
# way), since it's itself a Firecracker guest with no nested
# virtualization configured. So this workflow deliberately stops at
# "bake, static-check, publish" -- booting a real VM from a freshly
# published image to confirm it works is still a manual step run directly
# on aimax bare metal (see scripts/images/bake-*-image.sh's own "Test
# directly with: onctl create ..." footer).
#
# Which images exist is images/*/image.json (docs/plans/image-catalog.md),
# not a list here: the plan job asks `boxctl-image matrix` what this push
# changed. An image whose sources changed is rebuilt; one whose
# image.json alone changed only has its catalog manifest republished
# (rebuild: false). An image is built from images/<image>/Dockerfile
# (docs/plans/dockerfile-rootfs.md) -- its sources being that directory,
# whatever it builds from (images/common, an image it's FROM), and
# cmd/boxctl-image/build.go -- or, until it moves over, by its
# scripts/images/bake-<image>-image.sh. Publishing is one generic
# `boxctl-image publish` that uploads the image by sha and writes its
# catalog/<image>.json manifest.

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "scripts/images/bake-*-image.sh"
      - "cmd/boxctl-image/build.go"
      - ".github/workflows/build-fc-images.yml"
  workflow_dispatch:
    inputs:
      images:
        description: "Images to rebake and publish: comma-separated names, or 'all'"
        default: all

# One run at a time: two runs publishing the same image would race on its
# manifest (read, add the new generation, write back).
concurrency:
  group: build-fc-images
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: onctl-2
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # The whole history, so the push's before-sha is there to diff.
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Validate image definitions
        run: go run ./cmd/boxctl-image validate

      - name: Decide what to build
        id: matrix
        env:
          ONLY: ${{ inputs.images }}
          SINCE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            go run ./cmd/boxctl-image matrix -only "$ONLY" | tee -a "$GITHUB_OUTPUT"
          else
            go run ./cmd/boxctl-image matrix -since "$SINCE" | tee -a "$GITHUB_OUTPUT"
          fi

  bake-and-publish:
    name: ${{ matrix.rebuild && 'Bake + publish' || 'Publish manifest' }} (${{ matrix.image }})
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: onctl-2
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build boxctl-image
        run: go build -o "$RUNNER_TEMP/boxctl-image" ./cmd/boxctl-image

      - name: Build ${{ matrix.image }} image
        if: matrix.rebuild
        # From images/<image>/Dockerfile when it has one -- the Docker
        # build unprivileged (the runner user is in the docker group, and
        # buildx may be a per-user plugin root doesn't have), then
        # unpacking it and making the ext4 as root, since the tree is
        # root-owned. Otherwise its bake script, as before. See
        # docs/plans/dockerfile-rootfs.md.
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          if [ -f "images/$IMAGE/Dockerfile" ]; then
            command -v mkfs.ext4 >/dev/null || sudo apt-get install -y -qq e2fsprogs
            "$RUNNER_TEMP/boxctl-image" build "$IMAGE" -tar-only "$RUNNER_TEMP/rootfs.tar"
            sudo "$RUNNER_TEMP/boxctl-image" build "$IMAGE" -from-tar "$RUNNER_TEMP/rootfs.tar"
            rm -f "$RUNNER_TEMP/rootfs.tar"
          else
            sudo "$RUNNER_TEMP/boxctl-image" build "$IMAGE"
          fi

      - name: Static smoke test
        if: matrix.rebuild
        # Loop-mounts the freshly built image read-only and asserts the one
        # thing every build writes on success (the /opt/.baked
        # marker) -- catches "the bake silently failed partway through" or
        # "wrote to the wrong path" before it's ever published. Not a real
        # boot test (see this workflow's header comment for why that can't
        # run here) -- deliberately cheap and fast.
        run: |
          set -euo pipefail
          IMAGE="/opt/fc/images/${{ matrix.image }}.ext4"
          MOUNT=$(mktemp -d)
          sudo mount -o loop,ro "$IMAGE" "$MOUNT"
          trap 'sudo umount "$MOUNT"' EXIT
          test -e "$MOUNT/opt/.baked" || { echo "FAIL: /opt/.baked marker missing from $IMAGE" >&2; exit 1; }
          echo "OK: /opt/.baked present in $IMAGE"

      - name: Publish ${{ matrix.image }}
        env:
          CF_ACCESS_KEY: ${{ secrets.CF_ACCESS_KEY }}
          CF_SECRET_ACCESS_KEY: ${{ secrets.CF_SECRET_ACCESS_KEY }}
          CF_S3_ENDPOINT: ${{ secrets.CF_S3_ENDPOINT }}
        run: |
          set -euo pipefail
          args=(publish "${{ matrix.image }}" -git-sha "$GITHUB_SHA")
          [ "${{ matrix.rebuild }}" = true ] || args+=(-metadata-only)
          # sudo: the baked image and its sidecar are root's.
          sudo --preserve-env=CF_ACCESS_KEY,CF_SECRET_ACCESS_KEY,CF_S3_ENDPOINT "$RUNNER_TEMP/boxctl-image" "${args[@]}"
