name: publish-oci-images

# Publishes images/claude-agent as an OCI image, ghcr.io/boxctl-io/claude-agent,
# for linux/amd64 and linux/arm64. build-fc-images.yml turns the same
# Dockerfile into the ext4 rootfs Firecracker boxes boot and is unchanged;
# this is for runtimes that take a container image instead -- onctl's ac
# provider runs it as an Apple container on a Mac (arm64, hence the second
# platform), and gets sshd, tmux, git, gh and Claude Code ready-made rather
# than installing them on every new sandbox.
#
# The build graph (debian-slim as a stage, images/common as a context) is
# the one `boxctl-image build` generates; -bake-only writes it out for the
# `docker buildx bake` here, which adds the platforms and the push. The
# package is public (set once in its GitHub settings), so `container run`
# pulls it with no login.

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
    paths:
      - images/claude-agent/**
      - images/debian-slim/**
      - images/common/**
      - cmd/boxctl-image/**
      - .github/workflows/publish-oci-images.yml
  workflow_dispatch: {}

env:
  IMAGE: claude-agent
  REGISTRY_IMAGE: ghcr.io/boxctl-io/claude-agent

jobs:
  build-and-push:
    name: Build and push claude-agent
    runs-on: onctl-2
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up QEMU
        # The runner is amd64; arm64 layers build under user-mode emulation.
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write the bake file
        run: go run ./cmd/boxctl-image build "$IMAGE" -bake-only "$RUNNER_TEMP/bake.json"

      - name: Build and push
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: "0"
        run: |
          set -euo pipefail
          short=$(git rev-parse --short=7 "$GITHUB_SHA")
          docker buildx bake -f "$RUNNER_TEMP/bake.json" "$IMAGE" --push \
            --set '*.platform=linux/amd64' --set '*.platform=linux/arm64' \
            --set "$IMAGE.tags=$REGISTRY_IMAGE:latest" \
            --set "$IMAGE.tags=$REGISTRY_IMAGE:sha-$short" \
            --set "$IMAGE.cache-from=type=gha,scope=$IMAGE" \
            --set "$IMAGE.cache-to=type=gha,scope=$IMAGE,mode=max"
