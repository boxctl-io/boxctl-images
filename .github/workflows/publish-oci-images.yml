name: publish-oci-images

# Publishes images/claude-agent and images/claude-agent-go as OCI images,
# ghcr.io/boxctl-io/claude-agent and ghcr.io/boxctl-io/claude-agent-go,
# for linux/amd64 and linux/arm64. build-fc-images.yml turns the same
# Dockerfiles into the ext4 rootfs Firecracker boxes boot and is unchanged;
# this is for runtimes that take a container image instead -- onctl's ac
# provider runs them as Apple containers on a Mac (arm64, hence the second
# platform), and gets sshd, tmux, git, gh and Claude Code (plus Go, for the
# -go image) ready-made rather than installing them on every new sandbox.
#
# The build graph (debian-slim and claude-agent as stages, images/common as
# a context) is the one `boxctl-image build` generates for the -go image,
# which has the other as a stage; -bake-only writes it out for the one
# `docker buildx bake` here, which adds the platforms, the tags and the
# push, so claude-agent's layers are built once for both. The packages are
# public (set once in their GitHub settings, after the org allowed public
# packages), so `container run` pulls them with no login.

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
    paths:
      - images/claude-agent/**
      - images/claude-agent-go/**
      - images/debian-slim/**
      - images/common/**
      - cmd/boxctl-image/**
      - .github/workflows/publish-oci-images.yml
  workflow_dispatch: {}

env:
  # The image whose bake file has every target; the others are its stages.
  IMAGE: claude-agent-go
  IMAGES: claude-agent claude-agent-go
  REGISTRY: ghcr.io/boxctl-io

jobs:
  build-and-push:
    name: Build and push claude-agent, claude-agent-go
    runs-on: onctl-2
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up QEMU
        # The runner is amd64; arm64 layers build under user-mode emulation.
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write the bake file
        run: go run ./cmd/boxctl-image build "$IMAGE" -bake-only "$RUNNER_TEMP/bake.json"

      - name: Build and push
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: "0"
        run: |
          set -euo pipefail
          short=$(git rev-parse --short=7 "$GITHUB_SHA")
          set -- --set '*.platform=linux/amd64' --set '*.platform=linux/arm64'
          for image in $IMAGES; do
            set -- "$@" \
              --set "$image.tags=$REGISTRY/$image:latest" \
              --set "$image.tags=$REGISTRY/$image:sha-$short" \
              --set "$image.cache-from=type=gha,scope=$image" \
              --set "$image.cache-to=type=gha,scope=$image,mode=max"
          done
          # shellcheck disable=SC2086 # IMAGES is a word list
          docker buildx bake -f "$RUNNER_TEMP/bake.json" $IMAGES --push "$@"
